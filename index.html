<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stargazer 1v1</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    canvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <button id="btn-fullscreen">⛶ FULLSCREEN</button>

    <!-- Mobile Yellow Taunt Button -->
    <div id="btn-mobile-taunt" title="Taunt (T)">TAUNT</div>

    <div id="version-tag">
      v1.3.2 <span id="version-status" style="color:#666;">(checking...)</span>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="disconnect-banner" class="hidden">Opponent Disconnected! Waiting (30s)...</div>

    <!-- 0. STARTUP BOOT SCREEN (BEFORE MAIN MENU) -->
    <div id="screen-boot" class="overlay">
      <h1>STARGAZER</h1>
      <p id="boot-status" style="color: #45f3ff; font-size: 14px;">INITIALIZING ENGINE...</p>
      <button id="btn-boot-enter" class="btn hidden" style="border-color: #55e840; color: #55e840; font-size: 16px;">CLICK OR TAP TO ENTER</button>
    </div>

    <!-- 1. MAIN MENU -->
    <div id="menu-main" class="overlay hidden">
      <h1>STARGAZER</h1>
      <p style="color: #888;">Low-End Optimized 1v1 Rhythm Engine</p>
      <button id="btn-to-freeplay" class="btn">FREEPLAY (TRACKS)</button>
      <button id="btn-to-multi" class="btn">MULTIPLAYER (1v1)</button>
    </div>

    <!-- 2. FREEPLAY TRACK SELECTOR -->
    <div id="menu-song-select" class="overlay hidden">
      <h2>SELECT TRACK</h2>
      <div id="song-list" class="song-list-container"></div>
      <button id="btn-song-back" class="btn" style="border-color:#888; color:#888;">BACK</button>
    </div>

    <!-- 3. CHARACTER SELECT -->
    <div id="menu-character-select" class="overlay hidden">
      <h2 id="char-select-song-title">CHARACTER SELECT</h2>
      <p id="song-load-error" style="color: #ff5555; font-size: 13px;" class="hidden"></p>
      <button id="btn-freeplay-bf" class="btn">BOYFRIEND (RIGHT)</button>
      <button id="btn-freeplay-limes" class="btn">LIMES (LEFT)</button>
      <button id="btn-toggle-mirror" class="btn" style="border-color:#FFAA00; color:#FFAA00; font-size:12px;">MIRROR SPRITE: OFF</button>
      <button id="btn-char-back" class="btn" style="border-color:#888; color:#888;">BACK</button>
    </div>

    <!-- 4. MULTIPLAYER LOBBY -->
    <div id="menu-multi" class="overlay hidden">
      <h2>MULTIPLAYER LOBBY</h2>
      
      <div id="lobby-connect-box" style="display:flex; flex-direction:column; gap:10px; align-items:center;">
        <input type="text" id="input-server-url" value="https://scr-j5lv.onrender.com" placeholder="Server URL">
        <input type="text" id="input-room-code" placeholder="ROOM CODE (e.g. 1234)">
        <button id="btn-join-room" class="btn">JOIN / CREATE ROOM</button>
      </div>

      <div id="lobby-room-box" class="hidden" style="display:flex; flex-direction:column; gap:10px; align-items:center;">
        <p id="lobby-room-title" style="color:#66fcf1; font-weight:bold;"></p>
        <p id="lobby-status-text" style="color:#aaa; text-align:center; white-space:pre-line;">Waiting for opponent...</p>
        <button id="btn-switch-role" class="btn">SWITCH ROLE</button>
        <button id="btn-ready" class="btn btn-ready">TOGGLE READY</button>
      </div>

      <button id="btn-multi-back" class="btn" style="border-color:#888; color:#888;">BACK</button>
    </div>

    <!-- 5. MATCH RESULTS -->
    <div id="menu-results" class="overlay hidden">
      <h1 id="results-title">MATCH FINISHED</h1>
      <div id="results-body" style="font-size: 16px; text-align: center; line-height: 1.8;"></div>
      <button id="btn-results-menu" class="btn">MAIN MENU</button>
    </div>
  </div>

  <script type="module">
    import { RhythmEngine } from './engine.js';
    import { NetworkManager } from './network.js';

    const GITHUB_REPO = "Hacefr/scr";

    const canvas = document.getElementById('gameCanvas');
    const engine = new RhythmEngine(canvas);
    const network = new NetworkManager();

    let songCatalog = [];
    let selectedSong = null;

    // UI Elements
    const screenBoot = document.getElementById('screen-boot');
    const bootStatus = document.getElementById('boot-status');
    const btnBootEnter = document.getElementById('btn-boot-enter');

    const menuMain = document.getElementById('menu-main');
    const menuSongSelect = document.getElementById('menu-song-select');
    const menuCharSelect = document.getElementById('menu-character-select');
    const menuMulti = document.getElementById('menu-multi');
    const menuResults = document.getElementById('menu-results');
    const resultsTitle = document.getElementById('results-title');
    const resultsBody = document.getElementById('results-body');
    const disconnectBanner = document.getElementById('disconnect-banner');
    const songLoadError = document.getElementById('song-load-error');

    // 0. Boot Loader Sequence
    async function bootGame() {
      try {
        bootStatus.innerText = "Loading song registry...";
        const res = await fetch('assets/songs/songs.json');
        songCatalog = await res.json();
        selectedSong = songCatalog[0];
        populateSongList();

        bootStatus.innerText = "Ready!";
        btnBootEnter.classList.remove('hidden');
      } catch (err) {
        bootStatus.innerText = "Notice: Add assets/songs/songs.json";
        btnBootEnter.classList.remove('hidden');
      }
    }
    bootGame();

    btnBootEnter.onclick = async () => {
      // User gesture unlocks Web Audio API
      await engine.audio.initContext();
      screenBoot.classList.add('hidden');
      menuMain.classList.remove('hidden');
    };

    // Fullscreen Toggle
    document.getElementById('btn-fullscreen').onclick = () => {
      const wrapper = document.getElementById('game-wrapper');
      if (!document.fullscreenElement) {
        if (wrapper.requestFullscreen) wrapper.requestFullscreen();
        else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    };

    // Mobile Yellow Taunt Button
    document.getElementById('btn-mobile-taunt').onclick = (e) => {
      e.stopPropagation();
      engine.triggerTaunt();
    };

    // Mirror Sprite Toggle Button
    const btnToggleMirror = document.getElementById('btn-toggle-mirror');
    btnToggleMirror.onclick = () => {
      engine.mirrorSprite = !engine.mirrorSprite;
      btnToggleMirror.innerText = `MIRROR SPRITE: ${engine.mirrorSprite ? "ON" : "OFF"}`;
    };

    // Live GitHub Workflow Checker
    async function checkGitHubUpdates() {
      const statusEl = document.getElementById('version-status');
      try {
        const runsRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/actions/runs?per_page=1`);
        if (runsRes.ok) {
          const runsData = await runsRes.json();
          const latestRun = runsData.workflow_runs && runsData.workflow_runs[0];
          if (latestRun && (latestRun.status === 'in_progress' || latestRun.status === 'queued')) {
            statusEl.innerText = "(partial update deploying...)";
            statusEl.style.color = "#FFAA00";
            return;
          }
        }
        statusEl.innerText = "(latest)";
        statusEl.style.color = "#55e840";
      } catch (err) {
        statusEl.innerText = "";
      }
    }
    checkGitHubUpdates();

    function populateSongList() {
      const listEl = document.getElementById('song-list');
      listEl.innerHTML = '';

      songCatalog.forEach(song => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.style.borderLeftColor = song.color || '#55e840';

        card.innerHTML = `
          <div>
            <div class="song-card-title">${song.name}</div>
            <div class="song-card-artist">${song.artist || 'Unknown'}</div>
          </div>
          <div style="font-size:12px; color:${song.color || '#55e840'}; font-weight:bold;">${song.difficulty || 'Normal'}</div>
        `;

        card.onclick = () => {
          selectedSong = song;
          document.getElementById('char-select-song-title').innerText = song.name.toUpperCase();
          songLoadError.classList.add('hidden');
          menuSongSelect.classList.add('hidden');
          menuCharSelect.classList.remove('hidden');
        };

        listEl.appendChild(card);
      });
    }

    // Navigation
    document.getElementById('btn-to-freeplay').onclick = () => {
      menuMain.classList.add('hidden');
      menuSongSelect.classList.remove('hidden');
    };
    document.getElementById('btn-song-back').onclick = () => {
      menuSongSelect.classList.add('hidden');
      menuMain.classList.remove('hidden');
    };
    document.getElementById('btn-char-back').onclick = () => {
      menuCharSelect.classList.add('hidden');
      menuSongSelect.classList.remove('hidden');
    };
    document.getElementById('btn-to-multi').onclick = () => {
      menuMain.classList.add('hidden');
      menuMulti.classList.remove('hidden');
    };
    document.getElementById('btn-multi-back').onclick = () => {
      menuMulti.classList.add('hidden');
      menuMain.classList.remove('hidden');
    };
    document.getElementById('btn-results-menu').onclick = () => {
      menuResults.classList.add('hidden');
      menuMain.classList.remove('hidden');
      engine.state = 'READY';
    };

    // Freeplay Playback
    async function startFreeplay(role) {
      songLoadError.classList.add('hidden');
      try {
        await engine.loadAssets(selectedSong);
        menuCharSelect.classList.add('hidden');
        engine.gameMode = 'single';
        engine.setRole(role);
        await engine.startWithCountdown(2.4);
      } catch (err) {
        songLoadError.innerText = `Assets not found in assets/songs/${selectedSong.folder}/!`;
        songLoadError.classList.remove('hidden');
      }
    }

    document.getElementById('btn-freeplay-bf').onclick = () => startFreeplay('bf');
    document.getElementById('btn-freeplay-limes').onclick = () => startFreeplay('limes');

    // Multiplayer Flow
    const lobbyConnectBox = document.getElementById('lobby-connect-box');
    const lobbyRoomBox = document.getElementById('lobby-room-box');
    const lobbyRoomTitle = document.getElementById('lobby-room-title');
    const lobbyStatusText = document.getElementById('lobby-status-text');

    document.getElementById('btn-join-room').onclick = () => {
      const serverUrl = document.getElementById('input-server-url').value.trim();
      const code = document.getElementById('input-room-code').value.trim();
      if (!code) return alert("Please enter a room code!");

      network.connect(serverUrl);
      setTimeout(() => {
        network.joinRoom(code, 'bf');
        lobbyConnectBox.classList.add('hidden');
        lobbyRoomBox.classList.remove('hidden');
        lobbyRoomTitle.innerText = `ROOM: ${code.toUpperCase()}`;
      }, 400);
    };

    document.getElementById('btn-switch-role').onclick = () => network.switchRole();
    document.getElementById('btn-ready').onclick = () => network.toggleReady();

    engine.onNoteHitCallback = (data) => {
      if (engine.gameMode === 'multiplayer') network.sendNoteHit(data);
    };

    // Taunt Network Hook
    engine.onTauntCallback = (data) => {
      if (engine.gameMode === 'multiplayer' && network.socket) {
        network.socket.emit('player_note_hit', { type: 'taunt', role: data.role });
      }
    };

    network.onRoomUpdate = ({ players }) => {
      const me = players.find(p => p.id === network.localId);
      if (me) {
        engine.setRole(me.role);
        lobbyStatusText.innerText = `You are: ${me.role.toUpperCase()} | Ready: ${me.ready ? "YES" : "NO"}\nPlayers in Room: ${players.length}/2`;
      }
    };

    network.onMatchStarting = async ({ startTimestamp }) => {
      menuMulti.classList.add('hidden');
      engine.gameMode = 'multiplayer';

      await engine.loadAssets(selectedSong || songCatalog[0]);

      const delayMs = startTimestamp - Date.now();
      const delaySeconds = Math.max(0.1, delayMs / 1000);
      const scheduledAudioTime = engine.audio.ctx.currentTime + delaySeconds;

      await engine.startWithCountdown(delaySeconds, scheduledAudioTime);
    };

    network.onOpponentHit = (data) => {
      if (data.type === 'taunt') {
        engine.handleOpponentTaunt(data);
      } else {
        engine.handleOpponentNoteHit(data);
      }
    };

    network.onOpponentDisconnected = () => disconnectBanner.classList.remove('hidden');
    network.onOpponentReconnected = () => disconnectBanner.classList.add('hidden');
    network.onOpponentForfeit = ({ message }) => {
      disconnectBanner.classList.add('hidden');
      alert(message);
    };

    network.onMatchResults = ({ winnerId, players }) => {
      const me = players.find(p => p.id === network.localId);
      const opponent = players.find(p => p.id !== network.localId);

      if (winnerId === 'tie') {
        resultsTitle.innerText = "IT'S A DRAW! 🤝";
        resultsTitle.style.color = "#FFDD00";
      } else if (winnerId === network.localId) {
        resultsTitle.innerText = "VICTORY! 🏆";
        resultsTitle.style.color = "#55E840";
      } else {
        resultsTitle.innerText = "DEFEAT... 💀";
        resultsTitle.style.color = "#FF3333";
      }

      resultsBody.innerHTML = `
        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 6px; margin-bottom: 15px;">
          <p style="color: #66fcf1; font-weight: bold;">YOU (${me ? me.role.toUpperCase() : ''}):</p>
          <p>Score: ${me ? me.score : engine.score} | Accuracy: ${me ? me.accuracy : engine.accuracy}%</p>
          <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
          <p style="color: #ff7575; font-weight: bold;">OPPONENT (${opponent ? opponent.role.toUpperCase() : ''}):</p>
          <p>Score: ${opponent ? opponent.score : engine.opponentScore} | Accuracy: ${opponent ? opponent.accuracy : engine.opponentAccuracy}%</p>
        </div>
      `;
      menuResults.classList.remove('hidden');
    };

    let lastTime = performance.now();
    function gameLoop(currentTime) {
      const dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;

      engine.update(dt);
      engine.render();

      if (engine.state === 'FINISHED' && !menuResults.classList.contains('active')) {
        menuResults.classList.add('active');

        if (engine.gameMode === 'multiplayer') {
          network.sendFinished(engine.score, engine.accuracy);
        } else {
          resultsTitle.innerText = "SONG COMPLETE! 🎵";
          resultsTitle.style.color = "#66fcf1";
          resultsBody.innerHTML = `
            <p>Final Score: <strong>${engine.score}</strong></p>
            <p>Accuracy: <strong>${engine.accuracy}%</strong></p>
            <p>Max Combo: <strong>${engine.highestCombo}</strong></p>
          `;
          menuResults.classList.remove('hidden');
        }
      }

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
